<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#123629">
<title>Mahjong Big Tiles</title>
<style>
:root{--bg1:#2e7d62;--bg2:#123629}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#fff;
  background:var(--bg2);user-select:none;-webkit-user-select:none;touch-action:manipulation}
#bg{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 25%,var(--bg1) 0%,var(--bg2) 85%);transition:background .6s}
#bg.photo{background-size:cover;background-position:center 62%}
#shade{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .9s;background:linear-gradient(180deg,rgba(0,0,0,.12) 0%,rgba(0,0,0,.05) 40%,rgba(0,0,0,.3) 100%)}
#shade.on{opacity:1}
#scene{position:fixed;left:0;right:0;bottom:0;height:46%;pointer-events:none;opacity:.9}
#scene svg{width:100%;height:100%}
#app{position:fixed;inset:0;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header{transition:opacity .6s;display:flex;align-items:stretch;justify-content:space-between;gap:8px;padding:10px 12px 4px}
.stat{flex:1;background:rgba(0,0,0,.45);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-radius:14px;padding:6px 6px;text-align:center;min-width:0}
.stat b{display:block;font-size:24px;line-height:1.1}
.stat span{font-size:14px;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
#board{position:relative;flex:1;margin:4px 4px}
#tiles{position:absolute;left:0;top:0}
.tile{position:absolute;border-radius:12%/9%;background:linear-gradient(150deg,#fffef8 0%,#f6efda 70%,#eadfbf 100%);
  cursor:pointer;transition:transform .15s ease,opacity .3s ease,filter .2s ease,background .15s}
.tile svg{position:absolute;inset:6% 7%;width:86%;height:88%;pointer-events:none}
.tile.locked{filter:brightness(.7) saturate(.75)}
.tile.sel{background:linear-gradient(150deg,#fff8c9,#ffe47a);transform:translate(-2px,-4px);outline:4px solid #ffb300;outline-offset:-2px}
.tile.hint{animation:pulse .7s ease-in-out infinite alternate}
@keyframes pulse{from{outline:4px solid rgba(80,220,255,.4);outline-offset:-2px}to{outline:6px solid #3fd8ff;outline-offset:0;transform:translateY(-3px)}}
.tile.gone{opacity:0;transform:scale(.5) translateY(-24px) rotate(8deg);pointer-events:none}
.tile.shake{animation:shake .32s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.tile.flip{animation:flip .45s}
@keyframes flip{0%{transform:scaleX(1)}50%{transform:scaleX(.05)}100%{transform:scaleX(1)}}
.tile.enter{animation:enter .5s backwards}
@keyframes enter{from{opacity:0;transform:translateY(-40px) scale(.8)}}
.spark{position:absolute;width:10px;height:10px;border-radius:50%;pointer-events:none;z-index:999999;animation:burst .7s ease-out forwards}
@keyframes burst{from{transform:translate(0,0) scale(1);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
nav{transition:opacity .6s;display:flex;gap:8px;padding:6px 10px 12px}
nav button{flex:1;min-height:66px;border:0;border-radius:16px;background:rgba(0,0,0,.45);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:#fff;font-size:16px;font-weight:700;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;font-family:inherit}
nav button:active{background:rgba(255,255,255,.3)}
nav svg{width:28px;height:28px}
/* overlays */
.overlay{position:fixed;inset:0;background:rgba(5,20,15,.7);display:flex;align-items:center;justify-content:center;z-index:100000;padding:20px}
.hidden{display:none!important}
.card{background:#fffdf5;color:#1d2b25;border-radius:24px;padding:24px 22px;max-width:420px;width:100%;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.4);
  animation:cardin .3s ease-out;max-height:92vh;overflow-y:auto}
@keyframes cardin{from{transform:scale(.9);opacity:0}}
.card h1{margin:4px 0 6px;font-size:32px}
.card h2{margin:4px 0 8px;font-size:30px}
.card p{font-size:19px;line-height:1.45;margin:8px 0 16px;color:#3b4a43}
.big{display:block;width:100%;min-height:62px;border:0;border-radius:16px;font-size:21px;font-weight:800;margin:10px 0 0;cursor:pointer;font-family:inherit;color:#1d2b25}
.big:active{filter:brightness(.92)}
.primary{background:#1f7a5c;color:#fff}
.secondary{background:#e9e2cc}
.gold{background:linear-gradient(180deg,#ffd970,#f2b632);color:#3a2a00;box-shadow:0 4px 0 #b9821a}
.glass{background:rgba(255,255,255,.16);color:#fff}
.logo{display:flex;justify-content:center;gap:6px;margin-bottom:8px}
.logo div{width:62px;height:82px;border-radius:9px;background:linear-gradient(150deg,#fffef8,#eadfbf);box-shadow:3px 4px 0 #cdb98a,5px 7px 0 #9c855a;position:relative}
.logo div:nth-child(2){transform:translateY(-8px)}
.logo svg{position:absolute;inset:5px;width:52px;height:72px}
.stars{display:flex;justify-content:center;gap:6px;margin:6px 0 4px}
.stars svg{width:62px;height:62px}
.stars svg.on{animation:starpop .5s backwards}
.stars svg:nth-child(2){transform:translateY(-10px)}
@keyframes starpop{from{transform:scale(0) rotate(-40deg)}70%{transform:scale(1.25)}}
.post{border-radius:16px;overflow:hidden;height:170px;position:relative;margin:6px 0 10px;border:6px solid #fff;box-shadow:0 6px 18px rgba(0,0,0,.25);transform:rotate(-2deg)}
.post svg{position:absolute;inset:0;width:100%;height:100%}
.post .stamp{position:absolute;right:10px;top:10px;background:#fff;color:#c62828;font-weight:900;font-size:13px;padding:6px 8px;border:2px dashed #c62828;border-radius:4px;transform:rotate(6deg)}
.post .ttl{position:absolute;left:12px;bottom:8px;font-size:26px;font-weight:900;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.5)}
/* full screens */
.screen{position:fixed;inset:0;z-index:50000;overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:radial-gradient(ellipse at 50% 20%,var(--bg1) 0%,var(--bg2) 90%);
  padding:calc(env(safe-area-inset-top) + 14px) calc(env(safe-area-inset-right) + 16px) calc(env(safe-area-inset-bottom) + 24px) calc(env(safe-area-inset-left) + 16px)}
.screen .wrap{max-width:460px;margin:0 auto;position:relative}
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.back{border:0;background:rgba(0,0,0,.28);color:#fff;font-size:20px;font-weight:800;border-radius:14px;padding:12px 18px;cursor:pointer;font-family:inherit}
.topbar h2{margin:0;font-size:28px}
#home .wrap{min-height:calc(100vh - 60px);display:flex;flex-direction:column;justify-content:center;text-align:center}
#home h1{font-size:38px;margin:10px 0 2px;text-shadow:0 3px 10px rgba(0,0,0,.3)}
#home .sub{font-size:19px;opacity:.92;margin:0 0 22px}
#home .homescene{position:fixed;left:0;right:0;bottom:0;height:40%;pointer-events:none;opacity:.9}
#home .homescene svg{width:100%;height:100%}
.pill{display:inline-block;background:rgba(0,0,0,.28);border-radius:999px;padding:8px 16px;font-size:17px;font-weight:700;margin:4px auto 14px}
.chap{background:rgba(0,0,0,.25);border-radius:22px;margin:0 0 16px;overflow:hidden}
.chap .thumb{height:120px;position:relative}
.chap .thumb svg{position:absolute;inset:0;width:100%;height:100%}
.chap .thumb .nm{position:absolute;left:14px;bottom:10px;font-size:26px;font-weight:900;text-shadow:0 2px 6px rgba(0,0,0,.5)}
.chap .thumb .ct{position:absolute;right:12px;top:10px;font-size:14px;font-weight:800;background:rgba(0,0,0,.35);padding:6px 10px;border-radius:999px}
.chap.locked .thumb{filter:grayscale(1) brightness(.6)}
.lvls{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;padding:12px 10px 14px}
.lv{width:100%;border:0;border-radius:50%;aspect-ratio:1;background:#fffdf5;color:#1d2b25;font-size:20px;font-weight:900;cursor:pointer;font-family:inherit;position:relative;padding:0}
.lv.cur{background:#ffd970;box-shadow:0 0 0 4px rgba(255,217,112,.45);animation:glow 1.2s infinite alternate}
@keyframes glow{to{box-shadow:0 0 0 8px rgba(255,217,112,.15)}}
.lv:disabled{background:rgba(255,255,255,.18);color:rgba(255,255,255,.55);cursor:default}
.lvs{font-size:11px;color:#f2b632;letter-spacing:-1px;display:block;text-align:center;margin-top:3px;min-height:13px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;background:rgba(0,0,0,.25);border-radius:20px;padding:14px 10px}
.cal .h{font-size:14px;opacity:.8;text-align:center;font-weight:700}
.cal .d{aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800}
.cal .d.done{background:linear-gradient(180deg,#ffd970,#f2b632);color:#3a2a00}
.cal .d.today{box-shadow:0 0 0 3px #fff inset}
.cal .d.future{opacity:.35}
.streak{text-align:center;font-size:22px;font-weight:800;margin:6px 0 14px}
.month{text-align:center;font-size:20px;font-weight:800;margin:0 0 10px}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:rgba(0,0,0,.82);color:#fff;font-size:18px;padding:12px 20px;border-radius:14px;
  opacity:0;transition:opacity .3s;pointer-events:none;z-index:200000;text-align:center;max-width:90%}
#toast.show{opacity:1}
#caption{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 120px);text-align:center;z-index:120000;pointer-events:none;opacity:0;transform:translateY(12px);transition:all .7s}
#caption.show{opacity:1;transform:none}
#caption b{display:inline-block;background:rgba(0,0,0,.55);padding:12px 20px;border-radius:16px;font-size:22px;line-height:1.3;max-width:90%}
#caption span{display:block;font-size:15px;font-weight:600;opacity:.85}
#viewer{position:fixed;inset:0;z-index:170000;background:#000;animation:cardin .25s}
#viewer .vbg{position:absolute;inset:-40px;background-size:cover;background-position:center;filter:blur(30px) brightness(.45)}
#viewer .vimg{position:absolute;inset:0;background-size:contain;background-repeat:no-repeat;background-position:center;transition:opacity .25s}
#viewer button{position:absolute;border:0;background:rgba(0,0,0,.5);color:#fff;cursor:pointer;font-family:inherit;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
#viewer .vx{top:calc(env(safe-area-inset-top) + 14px);right:14px;width:54px;height:54px;border-radius:50%;font-size:26px;font-weight:800}
#viewer .vnav{top:50%;transform:translateY(-50%);width:54px;height:80px;border-radius:16px;font-size:44px;line-height:1}
#viewer .vl{left:8px}#viewer .vr{right:8px}
#viewer .vcap{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 24px);text-align:center;pointer-events:none}
#viewer .vcap b{display:inline-block;background:rgba(0,0,0,.6);padding:12px 20px;border-radius:16px;font-size:22px;max-width:90%}
#viewer .vcap span{display:block;font-size:15px;font-weight:600;opacity:.85}
.agrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px}
.aph{aspect-ratio:3/4;border-radius:12px;background-size:cover;background-position:center;border:0;cursor:pointer;position:relative;padding:0;overflow:hidden}
.aph.lock{background:rgba(255,255,255,.12)!important;cursor:default}
.aph .lk{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:rgba(255,255,255,.7);font-size:26px;font-weight:800}
.aph .lk small{font-size:13px;margin-top:4px}
.ahead{display:flex;justify-content:space-between;align-items:center;padding:14px 14px 0;font-size:24px;font-weight:900}
.ahead span{font-size:15px;font-weight:700;opacity:.85}
.chap .thumb{cursor:pointer}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:150000}
.opt{display:flex;gap:8px;margin-top:10px}
.opt button{flex:1;min-height:54px;border-radius:14px;border:3px solid transparent;font-size:16px;font-weight:800;cursor:pointer;font-family:inherit;color:#fff}
.opt button.on{border-color:#ffb300}
.lbl{font-size:16px;font-weight:800;color:#3b4a43;text-align:left;margin:16px 2px 0}
</style>
</head>
<body>
<div id="bg"></div>
<div id="shade"></div><div id="scene"></div>
<div id="app">
  <header>
    <div class="stat"><b id="sLevel">1</b><span id="sPlace">Level</span></div>
    <div class="stat"><b id="sPairs">0</b><span>Pairs left</span></div>
    <div class="stat"><b id="sMoves">0</b><span>Matches</span></div>
  </header>
  <div id="board"><div id="tiles"></div></div>
  <nav>
    <button id="bUndo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>Undo</button>
    <button id="bHint"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.3h6c0-1 .4-1.8 1-2.3A7 7 0 0 0 12 2z"/></svg>Hint</button>
    <button id="bShuf"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>Shuffle</button>
    <button id="bMenu"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>Menu</button>
  </nav>
</div>

<div id="home" class="screen"><div class="homescene" id="homeScene"></div><div class="wrap" id="homeWrap"></div></div>
<div id="map" class="screen hidden"><div class="wrap" id="mapWrap"></div></div>
<div id="daily" class="screen hidden"><div class="wrap" id="dailyWrap"></div></div>
<div id="album" class="screen hidden"><div class="wrap" id="albumWrap"></div></div>
<div id="viewer" class="hidden"><div class="vbg" id="vbg"></div><div class="vimg" id="vimg"></div>
 <button class="vx" id="vx">✕</button><button class="vnav vl" id="vl">‹</button><button class="vnav vr" id="vr">›</button>
 <div class="vcap" id="vcap"></div></div>

<div id="ov" class="overlay hidden"><div class="card" id="ovc"></div></div>
<canvas id="confetti"></canvas>
<div id="toast"></div>
<div id="caption"></div>

<script id="core">
/* ================= RNG ================= */
let RNG=Math.random;
const rnd=n=>Math.floor(RNG()*n);
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hashStr(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function shuffleArr(a){for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}

/* ================= Tile kinds & faces ================= */
const KINDS=[];
for(const s of ['d','b','c'])for(let n=1;n<=9;n++)KINDS.push(s+n);
KINDS.push('wE','wS','wW','wN','rR','rG','rW');
const P={1:[[30,40]],2:[[30,22],[30,58]],3:[[15,18],[30,40],[45,62]],4:[[17,22],[43,22],[17,58],[43,58]],
5:[[17,20],[43,20],[30,40],[17,60],[43,60]],6:[[17,16],[43,16],[17,40],[43,40],[17,64],[43,64]],
7:[[15,14],[30,22],[45,30],[17,50],[43,50],[17,68],[43,68]],
8:[[17,13],[43,13],[17,31],[43,31],[17,49],[43,49],[17,67],[43,67]],
9:[[15,16],[30,16],[45,16],[15,40],[30,40],[45,40],[15,64],[30,64],[45,64]]};
const DC=['#1d5fbf','#2e8b3a','#c62828'];
function stick(x,y,w,h,c){return `<rect x="${x-w/2}" y="${y-h/2}" width="${w}" height="${h}" rx="${w/2}" fill="${c}"/>`+
 `<rect x="${x-w/2}" y="${y-1.3}" width="${w}" height="2.6" fill="rgba(0,0,0,.35)"/>`+
 `<rect x="${x-w*.15}" y="${y-h/2+2.5}" width="${w*.3}" height="${h-5}" rx="${w*.15}" fill="rgba(255,255,255,.35)"/>`}
const FACE_CACHE={};
function face(k){
 if(FACE_CACHE[k])return FACE_CACHE[k];
 const s=k[0],v=k.slice(1);let g='';
 if(s==='d'){const n=+v;
  if(n===1)g=`<circle cx="30" cy="40" r="20" fill="#c62828"/><circle cx="30" cy="40" r="15" fill="#fff"/><circle cx="30" cy="40" r="11" fill="#1d5fbf"/><circle cx="30" cy="40" r="4.5" fill="#fff"/>`;
  else{const r={2:11,3:10,4:11,5:9.5,6:9.5,7:8,8:8,9:7}[n];
   P[n].forEach(([x,y],i)=>{const c=DC[(i+n)%3];g+=`<circle cx="${x}" cy="${y}" r="${r}" fill="${c}"/><circle cx="${x}" cy="${y}" r="${r*.5}" fill="none" stroke="#fff" stroke-width="${r*.24}"/>`})}}
 else if(s==='b'){const n=+v;
  if(n===1)g=stick(30,40,14,56,'#2e8b3a')+`<rect x="21" y="10" width="18" height="7" rx="3.5" fill="#c62828"/><rect x="21" y="63" width="18" height="7" rx="3.5" fill="#c62828"/>`;
  else{const h={2:28,3:20,4:28,5:22,6:20,7:15,8:15,9:20}[n],w={2:10,3:9,4:10,5:8,6:9,7:8,8:9,9:7}[n];
   P[n].forEach(([x,y],i)=>{const red=(n===5&&i===2)||(n===9&&i%3===1)||(n===7&&i<3);g+=stick(x,y,w,h,red?'#c62828':'#2e8b3a')})}}
 else if(s==='c'){g=`<text x="30" y="35" font-size="34" font-weight="800" text-anchor="middle" fill="#1a1a1a" font-family="Georgia,'Times New Roman',serif">${v}</text>`+
  `<text x="30" y="71" font-size="30" font-weight="700" text-anchor="middle" fill="#c62828">萬</text>`}
 else if(s==='w'){const ch={E:'東',S:'南',W:'西',N:'北'}[v];
  g=`<text x="30" y="29" font-size="26" font-weight="900" text-anchor="middle" fill="#1d5fbf" font-family="Arial,Helvetica,sans-serif">${v}</text>`+
   `<text x="30" y="70" font-size="34" font-weight="700" text-anchor="middle" fill="#1a1a1a">${ch}</text>`}
 else{
  if(v==='R')g=`<text x="30" y="57" font-size="46" font-weight="700" text-anchor="middle" fill="#c62828">中</text>`;
  else if(v==='G')g=`<text x="30" y="56" font-size="42" font-weight="700" text-anchor="middle" fill="#2e8b3a">發</text>`;
  else g=`<rect x="11" y="12" width="38" height="56" rx="5" fill="none" stroke="#1d5fbf" stroke-width="5"/><rect x="18" y="19" width="24" height="42" rx="3" fill="none" stroke="#1d5fbf" stroke-width="2.5"/>`;
 }
 return FACE_CACHE[k]=`<svg viewBox="0 0 60 80" xmlns="http://www.w3.org/2000/svg">${g}</svg>`;
}

/* ================= Layouts: digit = stack height ================= */
const SHAPES={
 'Welcome':['1111','1221','1221','1111'],
 'Little Cross':['.11.','1221','1221','.11.'],
 'Window':['11111','12.21','11111','12.21','11111'],
 'Diamond':['..1..','.121.','12321','.121.','..1..'],
 'Ladder':['2.2','121','2.2','121','2.2','121'],
 'Heart':['11.11','12121','12221','.121.','..1..'],
 'Tower':['111','121','131','121','131','121','111'],
 'Butterfly':['1...1','21.12','22122','21.12','1...1'],
 'Bridge':['2112','2..2','2112','2..2','2112'],
 'Flower':['.1.1.','12121','.131.','12121','.1.1.'],
 'Twin Towers':['12.21','23.32','23.32','23.32','12.21'],
 'Arch':['11111','12221','12.21','12.21','11.11'],
 'Pyramid':['11111','12221','12321','12221','11111'],
 'Lantern':['.11.','1221','2332','2332','1221','.11.'],
 'Garden':['21.12','12.21','..3..','12.21','21.12'],
 'Crown':['1.1.1','21212','22222','12321','11111'],
 'Castle':['2.2.2','21112','11111','12321','11111','2...2'],
 'Ship':['..1..','..2..','.121.','12221','11111','.111.'],
 'Turtle':['.1111.','122221','123321','122221','.1111.'],
 'Star':['..1..','.121.','12321','.232.','12.21'],
 'Fortress':['322223','2....2','2.33.2','2.33.2','2....2','322223'],

function parseShape(rows){
 const cells=[];rows.forEach((row,r)=>[...row].forEach((ch,c)=>{const h=+ch;if(h>0)cells.push({c,r,h})}));
 let sum=cells.reduce((s,x)=>s+x.h,0);
 if(sum%2){const m=cells.reduce((a,b)=>b.h>a.h?b:a);m.h--}
 const pos=[];for(const x of cells)for(let z=0;z<x.h;z++)pos.push({x:2*x.c,y:2*x.r,z});
 return pos;
}
const LAYOUTS=Object.entries(SHAPES).map(([name,rows])=>({name,pos:parseShape(rows)}))
 .sort((a,b)=>a.pos.length-b.pos.length);
/* Difficulty curve: 6 levels per destination; the first of each is relaxed, then it ramps up.
   Each of levels 1-48 gets its own board, matched by rank of target size. */
const PER_CH=6;
function targetFor(lv){const c=Math.floor((lv-1)/PER_CH),i=(lv-1)%PER_CH;return 16+c*8+i*7}
const LEVEL_MAP=(()=>{const n=Math.min(48,LAYOUTS.length);const lvls=Array.from({length:n},(_,k)=>k+1).sort((a,b)=>targetFor(a)-targetFor(b)||a-b);
 const m={};lvls.forEach((lv,r)=>m[lv]=LAYOUTS[r]);return m})();
function layoutForLevel(lv){if(LEVEL_MAP[lv])return LEVEL_MAP[lv];return LEVEL_MAP[[30,36,41,42,45,46,47,48,35,40,44,29][(lv-49)%12]]}
function diffForLevel(lv){if(lv>48)return .95;const c=Math.floor((lv-1)/PER_CH),i=(lv-1)%PER_CH;return Math.min(.95,.5+c*.06+i*.03)}

function makeTiles(pos){
 const T=pos.map((p,i)=>({...p,id:i,kind:null,removed:false,el:null}));
 for(const t of T){t.above=[];t.left=[];t.right=[];
  for(const u of T){if(u===t)continue;const dx=u.x-t.x,dy=u.y-t.y;
   if(u.z>t.z&&Math.abs(dx)<2&&Math.abs(dy)<2)t.above.push(u);
   else if(u.z===t.z&&Math.abs(dy)<2){if(dx<0&&dx>=-2)t.left.push(u);else if(dx>0&&dx<=2)t.right.push(u)}}}
 return T;
}
function isFreeG(t,g){return t.above.every(u=>g[u.id])&&(t.left.every(u=>g[u.id])||t.right.every(u=>g[u.id]))}
function pickWeighted(arr,T){let tot=0;const w=arr.map(i=>{const v=1+T[i].z*3;tot+=v;return v});let r=RNG()*tot;
 for(let k=0;k<arr.length;k++){r-=w[k];if(r<=0)return k}return arr.length-1}
/* Guaranteed-solvable deal: remove free pairs in reverse, then assign kinds */
function deal(T,idxs,pairKinds){
 for(let a=0;a<600;a++){
  const g=T.map(t=>t.removed);idxs.forEach(i=>g[i]=false);
  const order=[];let left=idxs.length;
  while(left>0){
   const fr=idxs.filter(i=>!g[i]&&isFreeG(T[i],g));
   if(fr.length<2)break;
   const i1=fr.splice(pickWeighted(fr,T),1)[0];const i2=fr[pickWeighted(fr,T)];
   order.push([i1,i2]);g[i1]=g[i2]=true;left-=2;
  }
  if(left===0){const pk=shuffleArr(pairKinds.slice());order.forEach(([x,y],k)=>{T[x].kind=T[y].kind=pk[k]});return true}
 }
 return false;
}
function kindsFor(diff,pairs){
 const n=Math.min(34,Math.max(6,Math.round(pairs*diff)));
 const chosen=shuffleArr(KINDS.slice()).slice(0,n);
 return Array.from({length:pairs},(_,i)=>chosen[i%n]);
}
function freeTiles(T){const g=T.map(t=>t.removed);return T.filter(t=>!t.removed&&isFreeG(t,g))}
function countMoves(T){const c={};freeTiles(T).forEach(t=>c[t.kind]=(c[t.kind]||0)+1);return Object.values(c).reduce((s,v)=>s+Math.floor(v/2),0)}

function place(){
 if(!T.length)return;
 const Wd=board.clientWidth,H=board.clientHeight;
 let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9,maxZ=0;
 for(const t of T){minX=Math.min(minX,t.x);maxX=Math.max(maxX,t.x);minY=Math.min(minY,t.y);maxY=Math.max(maxY,t.y);maxZ=Math.max(maxZ,t.z)}
 const sx=maxX-minX+2,sy=maxY-minY+2,u=fitU(sx,sy,maxZ),dp=u*.2,tw=2*u-2,th=2.6*u-2,d=Math.max(1.5,u*.07);
 const totW=sx*u+maxZ*dp,totH=sy*1.3*u+maxZ*dp;
 tilesEl.style.left=((Wd-totW)/2)+'px';tilesEl.style.top=((H-totH)/2)+'px';
 const shadow=`${d}px ${d*1.3}px 0 #cdb98a, ${d*1.8}px ${d*2.3}px 0 #9c855a, ${d*2}px ${d*3.2}px ${d*3}px rgba(0,0,0,.4)`;
 geom={tw,th};
 for(const t of T){const s=t.el.style;t.px=(t.x-minX)*u+(maxZ-t.z)*dp;t.py=(t.y-minY)*1.3*u+(maxZ-t.z)*dp;
  s.left=t.px+'px';s.top=t.py+'px';s.width=tw+'px';s.height=th+'px';s.zIndex=t.z*10000+t.y*100+t.x;s.boxShadow=shadow}
}
function refresh(){
 const g=T.map(t=>t.removed);
 for(const t of T){if(t.removed)continue;t.el.classList.toggle('locked',save.hl&&!isFreeG(t,g))}
 const alive=T.filter(t=>!t.removed).length;
 if(mode==='daily'){$('#sLevel').textContent='★';$('#sPlace').textContent='Daily';}
 else{$('#sLevel').textContent=level;$('#sPlace').textContent=chapterOf(level).name}
 $('#sPairs').textContent=alive/2;$('#sMoves').textContent=countMoves(T);
}
function clearHint(){clearTimeout(hintTimer);T.forEach(t=>t.el&&t.el.classList.remove('hint'))}
function onTile(t){
 audio();
 if(t.removed||!$('#ov').classList.contains('hidden'))return;
 const g=T.map(x=>x.removed);
 if(!isFreeG(t,g)){t.el.classList.remove('shake');void t.el.offsetWidth;t.el.classList.add('shake');sfx.no();
  toast('This tile is blocked.<br>Pick a tile with a free side.');return}
 clearHint();
 if(sel===t){t.el.classList.remove('sel');sel=null;return}
 if(sel&&sel.kind===t.kind){match(sel,t);return}
 if(sel)sel.el.classList.remove('sel');
 sel=t;t.el.classList.add('sel');sfx.tap();
}
function sparks(t){
 const cols=['#ffd970','#ffffff','#7fe0b0','#ff9f80'];
 for(let i=0;i<10;i++){const s=document.createElement('div');s.className='spark';
  const a=Math.PI*2*i/10+Math.random()*.4,r=40+Math.random()*40;
  s.style.left=(t.px+geom.tw/2-5)+'px';s.style.top=(t.py+geom.th/2-5)+'px';s.style.background=cols[i%4];
  s.style.setProperty('--dx',Math.cos(a)*r+'px');s.style.setProperty('--dy',Math.sin(a)*r+'px');
  tilesEl.appendChild(s);setTimeout(()=>s.remove(),750)}
}
function match(a,b){
 a.removed=b.removed=true;hist.push([a.id,b.id]);sel=null;
 for(const t of [a,b]){t.el.classList.remove('sel');t.el.classList.add('gone');sparks(t)}
 sfx.match();refresh();
 const alive=T.filter(t=>!t.removed).length;
 if(alive===0){if(curPhoto&&mode==='level'){$('#shade').classList.remove('on');showCaption();document.querySelector('header').style.opacity=.15;document.querySelector('nav').style.opacity=.15;
  setTimeout(()=>{document.querySelector('header').style.opacity='';document.querySelector('nav').style.opacity='';$('#caption').classList.remove('show');win()},2600)}else setTimeout(win,600)}
 else if(countMoves(T)===0)setTimeout(()=>noMoves(),700);
}
function undo(){
 audio();if(!hist.length){toast('Nothing to undo');return}
 clearHint();if(sel){sel.el.classList.remove('sel');sel=null}
 const [a,b]=hist.pop();for(const id of [a,b]){T[id].removed=false;T[id].el.classList.remove('gone')}
 sfx.tap();refresh();
}
function hint(){
 audio();clearHint();
 const by={};for(const t of freeTiles(T))(by[t.kind]=by[t.kind]||[]).push(t);
 const pair=Object.values(by).find(v=>v.length>=2);
 if(!pair){noMoves();return}
 helps++;pair.slice(0,2).forEach(t=>t.el.classList.add('hint'));sfx.tap();
 hintTimer=setTimeout(clearHint,3000);
}
function shuffle(){
 audio();clearHint();if(sel){sel.el.classList.remove('sel');sel=null}
 const alive=T.filter(t=>!t.removed);if(!alive.length)return;
 helps++;
 const cnt={};alive.forEach(t=>cnt[t.kind]=(cnt[t.kind]||0)+1);
 const pk=[];for(const k in cnt)for(let i=0;i<cnt[k]/2;i++)pk.push(k);
 const ok=deal(T,alive.map(t=>t.id),pk);
 if(!ok){const ks=shuffleArr(alive.map(t=>t.kind));alive.forEach((t,i)=>t.kind=ks[i])}
 hist=[];
 alive.forEach(t=>{t.el.classList.remove('flip','enter');void t.el.offsetWidth;t.el.classList.add('flip');setTimeout(()=>{t.el.innerHTML=face(t.kind)},220)});
 sfx.shuffle();setTimeout(refresh,240);
 if(!ok)setTimeout(()=>{if(countMoves(T)===0)noMoves(true)},600);
}

/* ================= Confetti ================= */
function confetti(){
 const c=$('#confetti'),x=c.getContext('2d'),dpr=window.devicePixelRatio||1;
 c.width=innerWidth*dpr;c.height=innerHeight*dpr;x.scale(dpr,dpr);
 const cols=['#ffd970','#ff6b6b','#4dd4a0','#5aa9ff','#ffffff','#c084fc'];
 const ps=Array.from({length:140},()=>({x:Math.random()*innerWidth,y:-20-Math.random()*innerHeight*.5,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,
  r:Math.random()*6.28,vr:(Math.random()-.5)*.3,w:7+Math.random()*6,h:4+Math.random()*4,c:cols[rnd(cols.length)]}));
 const t0=performance.now();
 (function fr(t){x.clearRect(0,0,innerWidth,innerHeight);
  for(const p of ps){p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.vy+=.03;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore()}
  if(t-t0<3500)requestAnimationFrame(fr);else x.clearRect(0,0,innerWidth,innerHeight)})(t0);
}

/* ================= Overlays ================= */
function overlay(html,actions){$('#ovc').innerHTML=html;$('#ov').classList.remove('hidden');
 $('#ovc').querySelectorAll('[data-a]').forEach(b=>b.addEventListener('click',()=>{audio();actions[b.dataset.a](b)}))}
function closeOv(){$('#ov').classList.add('hidden')}
let toastT=null;
function toast(m){const e=$('#toast');e.innerHTML=m;e.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('show'),1700)}
const STAR=on=>`<svg viewBox="0 0 24 24" class="${on?'on':''}"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z" fill="${on?'#f6b623':'#ddd5bd'}" stroke="${on?'#c98a0c':'#c9c0a6'}" stroke-width="1.2" stroke-linejoin="round"/></svg>`;
const logo=`<div class="logo"><div>${face('d5')}</div><div>${face('rR')}</div><div>${face('b3')}</div></div>`;
function postcard(ch){return `<div class="post">${album(ch)}<div class="stamp">${ch.country.toUpperCase()}</div><div class="ttl">${ch.name}</div></div>`}

function win(){
 sfx.win();confetti();
 const stars=helps===0?3:helps<=2?2:1;
 if(mode==='daily'){
  save.daily[dailyKey]=true;persist();const st=streak();
  overlay(`<h2>Daily Puzzle Solved!</h2><div class="stars">${STAR(1)}${STAR(1)}${STAR(1)}</div>
  <p>🔥 <b>${st} day${st>1?'s':''}</b> in a row. Come back tomorrow for a new puzzle!</p>
  <button class="big primary" data-a="cal">See Calendar</button><button class="big secondary" data-a="home">Home</button>`,
  {cal:()=>{closeOv();showDaily()},home:()=>{closeOv();showHome()}});
  [...$('#ovc').querySelectorAll('.stars svg')].forEach((s,i)=>s.style.animationDelay=(.2+i*.25)+'s');
  return;
 }
 save.stars[level]=Math.max(save.stars[level]||0,stars);
 const first=save.level<=level;
 save.level=Math.max(save.level,level+1);persist();
 const chapDone=level%PER===0;
 const msgs=['Well done!','Beautiful!','Excellent!','Great job!','Wonderful!','Superb!'];
 overlay(`<h2>${msgs[rnd(msgs.length)]}</h2><div class="stars">${STAR(stars>=1)}${STAR(stars>=2)}${STAR(stars>=3)}</div>
 <p>You cleared <b>Level ${level}</b>.${stars<3?'<br><span style="font-size:16px">Finish without Hint or Shuffle for 3 stars.</span>':''}</p>
 <button class="big primary" data-a="next">${chapDone&&first?'Collect Postcard':'Next Level'}</button>
 <button class="big secondary" data-a="map">Journey Map</button>`,
 {next:()=>{closeOv();if(chapDone&&first)showPostcard(chapterOf(level),level+1);else startGame('level',level+1)},map:()=>{closeOv();showMap()}});
 [...$('#ovc').querySelectorAll('.stars svg.on')].forEach((s,i)=>s.style.animationDelay=(.2+i*.25)+'s');
}
function showPostcard(ch,nextLv){
 sfx.post();confetti();const nx=chapterOf(nextLv);
 overlay(`<h2>New Postcard!</h2>${postcard(ch)}<p>You finished your visit to <b>${ch.name}</b>.<br>Next stop: <b>${nx.name}, ${nx.country}</b></p>
 <button class="big primary" data-a="go">Travel to ${nx.name}</button><button class="big secondary" data-a="map">Journey Map</button>`,
 {go:()=>{closeOv();startGame('level',nextLv)},map:()=>{closeOv();showMap()}});
}
function noMoves(hard){
 overlay(`<h2>No matches left</h2><p>${hard?'These tiles can’t be solved anymore. Try restarting.':'Don’t worry! Shuffle the tiles and keep playing.'}</p>
 ${hard?'':'<button class="big primary" data-a="shuf">Shuffle Tiles</button>'}
 <button class="big ${hard?'primary':'secondary'}" data-a="restart">Restart</button>
 ${hist.length?'<button class="big secondary" data-a="undo">Undo Last Move</button>':''}`,
 {shuf:()=>{closeOv();shuffle()},restart:()=>{closeOv();restart()},undo:()=>{closeOv();undo()}});
}
function restart(){mode==='daily'?startGame('daily'):startGame('level',level)}
function settingsHTML(){
 const th=Object.entries({journey:'Journey',green:'Green',blue:'Blue',warm:'Warm',night:'Night'});
 const col={journey:'linear-gradient(135deg,#2e7d62,#3d6699,#b9803c)',green:'#2e7d62',blue:'#2f6ea8',warm:'#a0603a',night:'#2a2a33'};
 return `<button class="big secondary" data-a="snd">Sound: ${save.sound?'On':'Off'}</button>
 <button class="big secondary" data-a="mus">Relaxing music: ${save.music?'On':'Off'}</button>
 <button class="big secondary" data-a="hl">Dim blocked tiles: ${save.hl?'On':'Off'}</button>
 <button class="big secondary" data-a="dev" style="background:#ffe9b0">🔓 Test mode – unlock all: ${save.dev?'On':'Off'}</button>
 <div class="lbl">Background</div>
 <div class="opt">${th.slice(0,3).map(([k,n])=>`<button data-a="th" data-t="${k}" class="${save.theme===k?'on':''}" style="background:${col[k]}">${n}</button>`).join('')}</div>
 <div class="opt">${th.slice(3).map(([k,n])=>`<button data-a="th" data-t="${k}" class="${save.theme===k?'on':''}" style="background:${col[k]}">${n}</button>`).join('')}</div>`;
}
function settingsActions(reopen){return{
 snd:()=>{save.sound=!save.sound;persist();reopen()},
 mus:()=>{save.music=!save.music;persist();save.music?startMusic():stopMusic();reopen()},
 hl:()=>{save.hl=!save.hl;persist();refresh();reopen()},
 dev:()=>{save.dev=!save.dev;persist();reopen()},
 th:b=>{save.theme=b.dataset.t;persist();applyTheme(mode==='level'&&T.length?chapterOf(level):CHAPTERS[Math.max(0,chapterIdx(save.level))%CHAPTERS.length]);reopen()}}}
function menu(){
 overlay(`<h2>Menu</h2>
 <button class="big primary" data-a="resume">Resume</button>
 <button class="big secondary" data-a="restart">Restart</button>
 <button class="big secondary" data-a="map">Journey Map</button>
 <button class="big secondary" data-a="home">Home</button>
 ${settingsHTML()}`,
 Object.assign({resume:closeOv,restart:()=>{closeOv();restart()},map:()=>{closeOv();showMap()},home:()=>{closeOv();showHome()}},settingsActions(menu)));
}
function settings(){
 overlay(`<h2>Settings</h2>${settingsHTML()}<button class="big primary" data-a="done">Done</button>`,
 Object.assign({done:()=>{closeOv();showHome()}},settingsActions(settings)));
}

/* ================= Screens ================= */
function hideScreens(){['#home','#map','#daily','#album'].forEach(s=>$(s).classList.add('hidden'))}
function curChapter(){return CHAPTERS[chapterIdx(save.level)%CHAPTERS.length]}
function showHome(){
 hideScreens();const ch=curChapter();applyTheme(ch);
 const ph=save.theme==='journey'&&photoFor(ch);
 $('#home').style.background=ph?`linear-gradient(180deg,rgba(0,0,0,.3),rgba(0,0,0,.65)),url(${ph.f}) ${ph.p}/cover`:'';
 $('#homeScene').innerHTML=save.theme==='journey'&&!ph?sceneSVG(ch.scene):'';
 const st=streak(),doneToday=!!save.daily[todayKey()];
 $('#homeWrap').innerHTML=`${logo}<h1>Mahjong Big Tiles</h1><p class="sub">Relaxing tile matching with extra‑large tiles</p>
 <div class="pill">📍 ${ch.name}, ${ch.country}</div>
 <button class="big gold" data-a="play">▶ Play Level ${save.level}</button>
 <button class="big glass" data-a="daily">📅 Daily Challenge ${doneToday?'✓':''}${st?` · 🔥${st}`:''}</button>
 <button class="big glass" data-a="map">🗺️ Journey Map</button>
 <button class="big glass" data-a="album">🖼️ Photo Album</button>
 <button class="big glass" data-a="set">⚙️ Settings</button>
 <button class="big glass" data-a="how" style="min-height:50px;font-size:18px">How to play</button>`;
 $('#home').classList.remove('hidden');
 const acts={play:()=>startGame('level',save.level),daily:showDaily,map:showMap,album:()=>showAlbum(),set:settings,how:howTo};
 $('#homeWrap').querySelectorAll('[data-a]').forEach(b=>b.addEventListener('click',()=>{audio();acts[b.dataset.a]()}));
}
function howTo(){
 overlay(`<h2>How to Play</h2>${logo}
 <p style="text-align:left">• Tap two <b>matching tiles</b> to clear them.<br>• A tile can be used when <b>nothing is on top</b> of it and its <b>left or right side is open</b>.<br>• Darker tiles are blocked for now.<br>• Clear all tiles to finish the level.<br>• Stuck? Use <b>Hint</b> or <b>Shuffle</b>. Every puzzle can be solved!</p>
 <button class="big primary" data-a="ok">Got it</button>`,{ok:closeOv});
}
/* ================= Photo album ================= */
function earned(lv){return save.dev||!!save.stars[lv]||lv<save.level}
function albumItems(){const out=[];CHAPTERS.forEach((ch,c)=>{const P=PHOTOS[ch.scene];if(!P)return;
 for(let i=0;i<PER;i++){const ph=P.list[i];if(!ph)continue;const lv=c*PER+i+1;out.push({ch,ph,lv,c})}});return out}
function showAlbum(focus){
 hideScreens();applyTheme(curChapter());
 const items=albumItems();const got=items.filter(it=>earned(it.lv)).length;
 let h=`<div class="topbar"><button class="back" data-a="home">‹ Home</button><h2>Photo Album</h2></div>
 <div class="pill" style="display:block;text-align:center">📷 ${got} of ${items.length} photos collected</div>`;
 CHAPTERS.forEach((ch,c)=>{const its=items.filter(it=>it.c===c);
  const n=its.filter(it=>earned(it.lv)).length;
  h+=`<div class="chap" id="alb${c}"><div class="ahead">${ch.name}<span>${its.length?n+' / '+its.length:'Coming soon'}</span></div><div class="agrid">`;
  if(!its.length)for(let i=0;i<PER;i++)h+=`<div class="aph lock"><div class="lk">🔒</div></div>`;
  its.forEach(it=>{h+=earned(it.lv)?`<button class="aph" data-i="${items.indexOf(it)}" style="background-image:url(${it.ph.f});background-position:${it.ph.p}"></button>`
   :`<div class="aph lock"><div class="lk">🔒<small>Level ${it.lv}</small></div></div>`});
  h+=`</div></div>`});
 $('#albumWrap').innerHTML=h;$('#album').classList.remove('hidden');
 $('#albumWrap').querySelector('[data-a=home]').addEventListener('click',()=>{audio();showHome()});
 $('#albumWrap').querySelectorAll('[data-i]').forEach(b=>b.addEventListener('click',()=>{audio();openViewer(+b.dataset.i)}));
 if(focus!=null){const el=$('#alb'+focus);if(el)setTimeout(()=>el.scrollIntoView({block:'start'}),30)}
}
let vList=[],vIdx=0;
function openViewer(i){vList=albumItems().filter(it=>earned(it.lv));const all=albumItems();vIdx=Math.max(0,vList.findIndex(it=>it.lv===all[i].lv));showV();$('#viewer').classList.remove('hidden')}
function showV(){const it=vList[vIdx];if(!it)return;
 $('#vbg').style.backgroundImage=`url(${it.ph.f})`;$('#vimg').style.backgroundImage=`url(${it.ph.f})`;
 $('#vcap').innerHTML=`<b>📍 ${it.ph.t}<span>${it.ch.name}, ${it.ch.country} · ${vIdx+1} / ${vList.length}</span></b>`;
 $('#vl').style.visibility=vIdx>0?'visible':'hidden';$('#vr').style.visibility=vIdx<vList.length-1?'visible':'hidden'}
function vStep(d){const n=vIdx+d;if(n<0||n>=vList.length)return;vIdx=n;$('#vimg').style.opacity=0;setTimeout(()=>{showV();$('#vimg').style.opacity=1},150)}
$('#vx').addEventListener('click',()=>$('#viewer').classList.add('hidden'));
$('#vl').addEventListener('click',()=>vStep(-1));$('#vr').addEventListener('click',()=>vStep(1));
let tx=null;$('#viewer').addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
$('#viewer').addEventListener('touchend',e=>{if(tx==null)return;const dx=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(dx)>50)vStep(dx<0?1:-1)});

function showMap(){
 hideScreens();applyTheme(curChapter());
 const maxCh=Math.max(chapterIdx(save.level)+1,CHAPTERS.length);
 let h=`<div class="topbar"><button class="back" data-a="home">‹ Home</button><h2>Your Journey</h2></div>`;
 for(let c=0;c<maxCh;c++){
  const ch=CHAPTERS[c%CHAPTERS.length],first=c*PER+1,lockedCh=first>save.level&&!save.dev,done=save.level>first+PER-1;
  h+=`<div class="chap ${lockedCh?'locked':''}" id="chap${c}"><div class="thumb" data-c="${c}">${pic(ch)}
   <div class="ct">${done?'✉️ Postcard collected':lockedCh?'🔒 Locked':'✈️ Visiting now'}</div><div class="nm">${c>=CHAPTERS.length?'↻ ':''}${ch.name}</div></div><div class="lvls">`;
  for(let l=first;l<first+PER;l++){const s=save.stars[l]||0,un=l<=save.level||save.dev;
   h+=`<div><button class="lv ${l===save.level?'cur':''}" ${un?'':'disabled'} data-l="${l}">${un?l:'🔒'}</button><span class="lvs">${s?'★'.repeat(s)+'☆'.repeat(3-s):''}</span></div>`}
  h+=`</div></div>`;
 }
 $('#mapWrap').innerHTML=h;$('#map').classList.remove('hidden');
 $('#mapWrap').querySelector('[data-a=home]').addEventListener('click',()=>{audio();showHome()});
 $('#mapWrap').querySelectorAll('.thumb[data-c]').forEach(t=>t.addEventListener('click',()=>{audio();showAlbum(+t.dataset.c)}));
 $('#mapWrap').querySelectorAll('[data-l]').forEach(b=>b.addEventListener('click',()=>{audio();startGame('level',+b.dataset.l)}));
 const cur=$('#chap'+chapterIdx(save.level));if(cur)setTimeout(()=>cur.scrollIntoView({block:'center'}),30);
}
function todayKey(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function streak(){
 const d=new Date();let n=0;if(!save.daily[todayKey(d)])d.setDate(d.getDate()-1);
 while(save.daily[todayKey(d)]){n++;d.setDate(d.getDate()-1)}return n;
}
function showDaily(){
 hideScreens();applyTheme(curChapter());
 const now=new Date(),y=now.getFullYear(),m=now.getMonth(),days=new Date(y,m+1,0).getDate(),start=(new Date(y,m,1).getDay()+6)%7;
 const mn=now.toLocaleString('en-US',{month:'long'});const st=streak(),done=!!save.daily[todayKey()];
 let cal='';['Mo','Tu','We','Th','Fr','Sa','Su'].forEach(x=>cal+=`<div class="h">${x}</div>`);
 for(let i=0;i<start;i++)cal+='<div></div>';
 for(let d=1;d<=days;d++){const k=todayKey(new Date(y,m,d));cal+=`<div class="d ${save.daily[k]?'done':''} ${d===now.getDate()?'today':''} ${d>now.getDate()?'future':''}">${save.daily[k]?'✓':d}</div>`}
 const cnt=Object.keys(save.daily).filter(k=>k.startsWith(`${y}-${String(m+1).padStart(2,'0')}`)).length;
 $('#dailyWrap').innerHTML=`<div class="topbar"><button class="back" data-a="home">‹ Home</button><h2>Daily Challenge</h2></div>
 <div class="streak">${st?`🔥 ${st} day${st>1?'s':''} in a row!`:'Start your streak today!'}</div>
 <div class="month">${mn} ${y} · ${cnt} solved</div><div class="cal">${cal}</div>
 <button class="big gold" data-a="play" style="margin-top:18px">${done?'↻ Play Today’s Puzzle Again':'▶ Play Today’s Puzzle'}</button>
 <p style="text-align:center;font-size:17px;opacity:.85;margin-top:14px">A new puzzle every day — the same one for every player.</p>`;
 $('#daily').classList.remove('hidden');
 const acts={home:showHome,play:()=>startGame('daily')};
 $('#dailyWrap').querySelectorAll('[data-a]').forEach(b=>b.addEventListener('click',()=>{audio();acts[b.dataset.a]()}));
}

/* ================= Wiring ================= */
$('#bUndo').addEventListener('click',undo);
$('#bHint').addEventListener('click',hint);
$('#bShuf').addEventListener('click',shuffle);
$('#bMenu').addEventListener('click',()=>{audio();menu()});
window.addEventListener('resize',()=>requestAnimationFrame(place));
showHome();
</script>
